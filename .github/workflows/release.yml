name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # La clave de firma va en el secreto KEYSTORE_BASE64; sin ella el APK no podría
      # actualizarse encima de una versión anterior.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Falta el secreto KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK firmado
        env:
          CANVAS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          CANVAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CANVAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CANVAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Empaquetar
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/canvas-today-${GITHUB_REF_NAME}.apk"
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Notas desde CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Versión $version" > notes.md

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
